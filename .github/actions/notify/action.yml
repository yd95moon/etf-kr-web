name: 'Telegram notify'
description: '텔레그램으로 알림을 보낸다. 시크릿이 없으면 조용히 건너뛰고, 전송 실패해도 파이프라인을 세우지 않는다.'

inputs:
  token:
    description: 'Telegram bot token (secrets.TELEGRAM_BOT_TOKEN)'
    required: false
    default: ''
  chat_id:
    description: 'Telegram chat id (secrets.TELEGRAM_CHAT_ID)'
    required: false
    default: ''
  text:
    description: '보낼 메시지 본문'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TG_TOKEN: ${{ inputs.token }}
        TG_CHAT: ${{ inputs.chat_id }}
        TG_TEXT: ${{ inputs.text }}
      run: |
        # 알림은 부가 기능이다. 어떤 이유로 실패해도 exit 0 — 배포 파이프라인을
        # 알림 때문에 세우지 않는다.
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿 없음 — 알림 생략"
          exit 0
        fi
        if [ -z "$TG_TEXT" ]; then
          echo "보낼 메시지 없음 — 생략"
          exit 0
        fi
        # 토큰이 URL에 들어가므로 응답 본문·요청 URL을 로그에 남기지 않는다.
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT}" \
          --data-urlencode "text=${TG_TEXT}" \
          --data-urlencode "disable_web_page_preview=true") || code="000"
        if [ "$code" = "200" ]; then
          echo "telegram sendMessage OK"
        else
          echo "::warning::텔레그램 전송 실패 (http ${code})"
        fi
        exit 0
